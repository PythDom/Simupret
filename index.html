<!doctype html>
<html lang="fr-BE">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Simulateur de crédit hypothécaire belge : tranches, remboursements anticipés, TAEG et optimiseur." />
    <meta name="theme-color" content="#1d4ed8" />
    <title>Simulateur de crédit hypothécaire</title>
    <script>
      // Applique le thème avant le premier rendu pour éviter un flash.
      try {
        var t = localStorage.getItem('simupret-theme');
        var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

name: APK Android

# Sur un tag v* : construit l'APK et le publie dans une GitHub Release.
# Lancement manuel (workflow_dispatch) : avec une version (ex. 1.0.0), crée le tag v1.0.0 et la
# release ; sans version, fournit seulement l'APK comme artefact.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version à publier (ex. 1.0.0). Vide : APK de test en artefact, sans release.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: Construire l'APK
    runs-on: ubuntu-latest
    env:
      # Secrets de signature (voir README). S'ils sont absents, un APK debug est produit.
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build web
        run: npm run build

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          # Le paquet « tools » installé par défaut n'existe plus dans sdkmanager.
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Déterminer la version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "$INPUT_VERSION" ]]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          # versionCode : MAJEUR*10000 + MINEUR*100 + CORRECTIF pour un tag x.y.z, sinon numéro d'exécution.
          if [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            CODE=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          else
            CODE="${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" || -n "$INPUT_VERSION" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION (code $CODE)"

      - name: Décoder le keystore
        id: keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Construire l'APK signé (release)
        if: steps.keystore.outputs.signed == 'true'
        working-directory: android
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          ./gradlew --no-daemon assembleRelease
          mkdir -p ../dist-apk
          cp app/build/outputs/apk/release/app-release.apk "../dist-apk/simupret-${APP_VERSION_NAME}.apk"

      - name: Construire l'APK debug (secrets de signature absents)
        if: steps.keystore.outputs.signed != 'true'
        working-directory: android
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          echo "::warning::Secrets de signature absents : construction d'un APK debug."
          ./gradlew --no-daemon assembleDebug
          mkdir -p ../dist-apk
          cp app/build/outputs/apk/debug/app-debug.apk "../dist-apk/simupret-${APP_VERSION_NAME}-debug.apk"

      - name: Vérifier la signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs dist-apk/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: simupret-${{ steps.version.outputs.name }}
          path: dist-apk/*.apk
          if-no-files-found: error

      - name: Publier la release
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          # Lancement manuel : le tag est créé sur le commit construit.
          tag_name: v${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: dist-apk/*.apk
          name: Simulateur de crédit ${{ steps.version.outputs.name }}
          body: |
            ## Installation sur Android

            1. Téléchargez le fichier `.apk` ci-dessous depuis votre téléphone.
            2. Ouvrez-le et autorisez l'installation depuis cette source si Android le demande.
            3. Lancez « Simulateur de crédit ».

            ${{ steps.keystore.outputs.signed == 'true' && 'APK signé avec la clé de publication.' || '⚠️ APK **debug** : les secrets de signature ne sont pas configurés. Une future version signée ne pourra pas le mettre à jour ; désinstallez-le d''abord.' }}

            Simulation indicative : ne constitue pas un conseil financier.

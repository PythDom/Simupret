name: Diagnostic taux BNB (temporaire)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Séries MIR Belgique — crédits au logement, nouveaux contrats
        run: |
          set -x
          curl -sS -m 60 "https://data-api.ecb.europa.eu/service/data/MIR/M.BE.B.A2C...A.2250.EUR.N?lastNObservations=2&format=csvdata" -o mir.csv || true
          head -c 400 mir.csv; echo
          python3 - <<'PY'
          import csv
          rows = list(csv.DictReader(open('mir.csv', encoding='utf-8')))
          print('colonnes:', list(rows[0].keys()) if rows else None)
          for r in rows:
              print(r.get('KEY'), '|', r.get('TIME_PERIOD'), '|', r.get('OBS_VALUE'), '|', r.get('TITLE'), '|', r.get('UNIT'))
          PY
      - name: Séries renégociations / APRC
        run: |
          curl -sS -m 60 "https://data-api.ecb.europa.eu/service/data/MIR/M.BE.B.A2C....?lastNObservations=1&format=csvdata" -o all.csv || true
          python3 - <<'PY'
          import csv
          for r in csv.DictReader(open('all.csv', encoding='utf-8')):
              print(r.get('KEY'), '|', r.get('TIME_PERIOD'), '|', r.get('OBS_VALUE'), '|', r.get('TITLE'))
          PY
      - name: En-têtes CORS (ECB)
        run: |
          curl -sS -m 30 -D - -o /dev/null -H "Origin: https://example.org" "https://data-api.ecb.europa.eu/service/data/MIR/M.BE.B.A2C.P.R.A.2250.EUR.N?lastNObservations=1&format=jsondata" | grep -iE "^HTTP|access-control|content-type" || true
          curl -sS -m 30 -D - -o /dev/null -X OPTIONS -H "Origin: https://example.org" -H "Access-Control-Request-Method: GET" "https://data-api.ecb.europa.eu/service/data/MIR/M.BE.B.A2C.P.R.A.2250.EUR.N" | grep -iE "^HTTP|access-control" || true
      - name: NBB.Stat (catalogue)
        run: |
          curl -sS -m 30 -D - -o nbb.txt -H "Origin: https://example.org" "https://nsidisseminate-stat.nbb.be/rest/dataflow/all/all/latest" | grep -iE "^HTTP|access-control|content-type" || true
          grep -oiE '<(str|structure):Dataflow [^>]*id="[^"]*"[^>]*>' nbb.txt | head -5 || true
          grep -oiE 'id="[^"]*(MIR|INTEREST|RATE|TAUX)[^"]*"' nbb.txt | sort -u | head -40 || true
